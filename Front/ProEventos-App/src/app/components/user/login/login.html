<div class="d-flex align-items-center justify-content-center vh-100 px-2">
  <div class="text-center shadow-sm bg-white rounded p-4 w-100" style="max-width: 370px">
    <form class="d-flex flex-column align-items-center">
      <i class="fa fa-users mb-2"></i>

      <h1 class="h3 mb-3 fw-normal">Entrar com</h1>

      <label for="username" class="visually-hidden"> Usuário </label>

      <input
        type="email"
        id="username"
        class="form-control rounded-0 rounded-top"
        placeholder="Usuário"
        name="username"
        required
      />

      <label for="password" class="visually-hidden"> Password </label>

      <input
        type="password"
        id="password"
        class="form-control rounded-0"
        placeholder="Senha"
        name="password"
        required
      />

      <button class="btn btn-lg btn-primary w-100 rounded-0 rounded-bottom" type="submit">
        Entrar
      </button>

      <p class="mt-4 mb-2 text-muted">Não tem login? Cadastre-se abaixo</p>

      <a class="btn btn-lg btn-link w-100" routerLink="/user/registration"> Quero me cadastrar </a>
    </form>
  </div>
</div>
