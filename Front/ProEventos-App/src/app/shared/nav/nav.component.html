@if (showMenu()){
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" routerLink="dashboard"><i class="fa fa-users mb-2"></i></a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="isCollapsed = !isCollapsed"
      [attr.aria-expanded]="!isCollapsed"
      aria-controls="navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="navbarNav" class="navbar-collapse" [collapse]="isCollapsed" [isAnimated]="true">
      <ul class="navbar-nav me-auto">
        <li class="nav-item" routerLinkActive="active">
          <a class="nav-link" routerLink="/eventos/lista">Eventos</a>
        </li>

        <li class="nav-item" routerLinkActive="active">
          <a class="nav-link" routerLink="palestrantes">Palestrantes</a>
        </li>

        <li class="nav-item" routerLinkActive="active">
          <a class="nav-link" routerLink="contatos">Contatos</a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item dropdown" dropdown>
          <a
            dropdownToggle
            class="nav-link dropdown-toggle"
            role="button"
            id="navbarDropdownMenuLink"
            data-toggle="dropdown"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Vinícius
          </a>
          <div *dropdownMenu class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
            <a class="dropdown-item" routerLink="/user/perfil"> Perfil </a>
            <div role="separator" class="divider"></div>
            <a class="dropdown-item" routerLink="/user/login"> Sair </a>
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>
}
